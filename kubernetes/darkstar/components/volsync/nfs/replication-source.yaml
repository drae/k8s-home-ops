---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: "${VOLSYNC_CLAIM:-${APP}}"
  trigger:
    # Once a night so zstore wakes once: 02:30 UTC is 03:30 BST / 02:30 GMT,
    # inside the 02:00-05:00 cheap-rate window either side of the clock change.
    # H is not valid cron: the volsync-schedule-jitter MutatingAdmissionPolicy
    # (apps/storage/volsync) swaps it for a per-app minute in 30-39
    schedule: "H 2 * * *"
  restic:
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:-1Gi}"
    cacheStorageClassName: "${VOLSYNC_CACHE_SNAPSHOTCLASS:-local-hostpath}"
    copyMethod: "${VOLSYNC_COPYMETHOD:-Snapshot}"
    moverSecurityContext:
      runAsUser: ${APP_UID:-2000}
      runAsGroup: ${APP_GID:-2000}
      fsGroup: ${APP_GID:-2000}
    pruneIntervalDays: 7
    retain:
      daily: 14
      weekly: 4
    repository: "${APP}-volsync-nfs"
    storageClassName: "${VOLSYNC_STORAGECLASS:-topolvm-thin-provisioner}"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:-topolvm-thin-provisioner}"
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            server: 10.1.10.10
            path: /mnt/zstore/backup/volsync
