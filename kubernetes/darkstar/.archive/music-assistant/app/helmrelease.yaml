---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      music-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.1@sha256:e6edefe825b1cdc50223c16d9bc2fca909a158b36555a7763512b76ba04a1b9e
            env:
              TZ: Europe/London
              LOG_LEVEL: info
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              fsGroup: 2000
              fsGroupChangePolicy: OnRootMismatch
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_ADMIN
                  - DAC_READ_SEARCH
          alexa-skill:
            image:
              repository: ghcr.io/alams154/music-assistant-skill
              tag: latest@sha256:8e8bfc59af754e6892599b36e9d2ba154e2e4ddb4461118900764477d4adb70e
            env:
              TZ: Europe/London
              SKILL_HOSTNAME: mass-ax.starstreak.net
              MA_HOSTNAME: mass-st.starstreak.net
              PORT: 5000
              LOCALE: en-GB
              AWS_DEFAULT_REGION: eu-west-2
            envFrom:
              - secretRef:
                  name: mass-alexa-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "networking",
            "interface": "iot",
            "ips": [
              "10.1.20.38/24",
              "fd79:4c9c:b9c3:20::38/64"
            ]
          }]
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.forwarding
            value: "1"
          - name: net.ipv6.conf.iot.accept_ra_rt_info_max_plen
            value: "64"
          - name: net.ipv6.conf.iot.accept_ra
            value: "2"
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.10.38
        ipFamilyPolicy: PreferDualStack
        ports:
          http:
            port: &port 8095
            primary: true
          stream:
            port: 8097
      alexa-skill:
        ports:
          http:
            port: 5000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - mass.starstreak.net
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      stream:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - mass-st.starstreak.net
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8097
      alexa-skill:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - mass-ax.starstreak.net
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: alexa-skill
                port: 5000
    persistence:
      data:
        existingClaim: music-assistant-config
        advancedMounts:
          music-assistant:
            app:
              - path: /data
                subPath: data
              - path: /cache
                subPath: cache
              - path: /.local
                subPath: .local
            alexa-skill:
              - path: /root/.ask
                subPath: .ask
      tmp:
        type: emptyDir
