---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      music-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.7@sha256:dce482dc3bf4093735acf217b3bead74a05c46d40922341e775580c6d05394cd
            env:
              TZ: Europe/London
              LOG_LEVEL: info
              # Root filesystem is read-only; point model/JIT caches at the
              # /cache volume (Smart Fades and Sonic analysis fail without it)
              XDG_CACHE_HOME: /cache/xdg
              NUMBA_CACHE_DIR: /cache/numba
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_ADMIN
                  - DAC_READ_SEARCH
    defaultPodOptions:
      # Host network for player discovery (mDNS/SSDP) and stream URLs on the LAN
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # fsGroup is pod-level only; user/group stay on the app container so
      # the alexa-skill sidecar keeps running as root
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.10.38
        ports:
          http:
            port: &port 8095
            primary: true
          stream:
            port: 8097
      alexa-skill:
        ports:
          http:
            port: 5000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - mass.starstreak.net
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: music-assistant-config
        advancedMounts:
          music-assistant:
            app:
              - path: /data
                subPath: data
              - path: /cache
                subPath: cache
              - path: /.local
                subPath: .local
            alexa-skill:
              - path: /root/.ask
                subPath: .ask
      tmp:
        type: emptyDir
