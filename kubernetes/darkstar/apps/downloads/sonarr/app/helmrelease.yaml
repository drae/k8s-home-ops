---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  upgrade:
    cleanupOnFail: true
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
            env:
              TZ: Europe/London
              SONARR__INSTANCE_NAME: Sonarr
              SONARR__PORT: &port 8989
              SONARR__AUTHENTICATION_METHOD: External
              SONARR__AUTHENTICATION_REQUIRED: DisabledForLocalAddresses
              SONARR__THEME: dark
            envFrom:
              - secretRef:
                  name: sonarr-secret
            resources:
              requests:
                memory: 512M
                cpu: 20m
              limits:
                memory: 768M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      rescan:
        # Refresh is metadata-only ("rescan after refresh" = afterManual); one
        # full disk scan a night, just after VolSync while zstore is already up
        type: cronjob
        cronjob:
          schedule: "35 2 * * *"
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - -ec
            args:
              - |
                api=http://sonarr.downloads.svc.cluster.local:8989/api/v3
                h="X-Api-Key: $SONARR__AUTH__APIKEY"
                # Re-assert the setting so a restored database can't undo it
                curl -fsS -H "$h" "$api/config/mediamanagement" \
                  | sed -E 's/"rescanAfterRefresh": *"[A-Za-z]+"/"rescanAfterRefresh": "afterManual"/' \
                  | curl -fsS -X PUT -H "$h" -H "Content-Type: application/json" --data-binary @- "$api/config/mediamanagement" >/dev/null
                curl -fsS -X POST -H "$h" -H "Content-Type: application/json" \
                  -d '{"name": "RescanSeries"}' "$api/command" >/dev/null
            envFrom:
              - secretRef:
                  name: sonarr-secret
            resources:
              requests:
                cpu: 5m
                memory: 16M
              limits:
                memory: 32M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - sonarr.starstreak.net
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          sonarr:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          sonarr:
            app:
              - path: /tmp
      media:
        type: nfs
        server: 10.1.10.10
        path: /mnt/zstore/media
        advancedMounts:
          sonarr:
            app:
              - path: /mnt/media
      scripts:
        type: configMap
        name: sonarr-configmap
        defaultMode: 0775
        advancedMounts:
          sonarr:
            app:
              - path: /scripts
                readOnly: true
      cache:
        existingClaim: sonarr-cache
        advancedMounts:
          sonarr:
            app:
              - path: /config/MediaCover
