---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              TZ: Europe/London
              RADARR__INSTANCE_NAME: Radarr
              RADARR__PORT: &port 7878
              RADARR__AUTHENTICATION_METHOD: External
              RADARR__AUTHENTICATION_REQUIRED: DisabledForLocalAddresses
              RADARR__THEME: dark
            envFrom:
              - secretRef:
                  name: radarr-secret
            resources:
              requests:
                memory: 250Mi
                cpu: 25m
              limits:
                memory: 500Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      rescan:
        # Refresh is metadata-only ("rescan after refresh" = afterManual); one
        # full disk scan a night, just after VolSync while zstore is already up
        type: cronjob
        cronjob:
          schedule: "35 2 * * *"
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - -ec
            args:
              - |
                api=http://radarr.downloads.svc.cluster.local:7878/api/v3
                h="X-Api-Key: $RADARR__AUTH__APIKEY"
                # Re-assert the setting so a restored database can't undo it
                curl -fsS -H "$h" "$api/config/mediamanagement" \
                  | sed -E 's/"rescanAfterRefresh": *"[A-Za-z]+"/"rescanAfterRefresh": "afterManual"/' \
                  | curl -fsS -X PUT -H "$h" -H "Content-Type: application/json" --data-binary @- "$api/config/mediamanagement" >/dev/null
                curl -fsS -X POST -H "$h" -H "Content-Type: application/json" \
                  -d '{"name": "RescanMovie"}' "$api/command" >/dev/null
            envFrom:
              - secretRef:
                  name: radarr-secret
            resources:
              requests:
                cpu: 5m
                memory: 16M
              limits:
                memory: 32M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: radarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - radarr.starstreak.net
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          radarr:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          radarr:
            app:
              - path: /tmp
      media:
        type: nfs
        server: 10.1.10.10
        path: /mnt/zstore/media
        advancedMounts:
          radarr:
            app:
              - path: /mnt/media
      cache:
        existingClaim: radarr-cache
        advancedMounts:
          radarr:
            app:
              - path: /config/MediaCover
