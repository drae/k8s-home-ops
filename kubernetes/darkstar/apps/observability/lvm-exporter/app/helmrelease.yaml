---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lvm-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  upgrade:
    cleanupOnFail: true
  values:
    controllers:
      lvm-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/drae/lvm-exporter
              tag: v0.6.2@sha256:7eb172e9778d512fb72e8151cabbd95a9c0899b2179d4594f04947822ad9c41e
            securityContext:
              privileged: true
    service:
      app:
        controller: lvm-exporter
        ports:
          http:
            port: 9845
    serviceMonitor:
      app:
        serviceName: lvm-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
