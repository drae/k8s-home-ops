---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: sabon
spec:
  staticConfigs:
    - targets:
        - "10.1.10.10:9333"
  metricsPath: /metrics
  scheme: HTTP
  relabelings:
    - targetLabel: instance # remove port from instance
      action: replace
      sourceLabels: [__address__]
      regex: (.*):\d*
  metricRelabelings:
    - action: drop
      sourceLabels: [__name__]
      regex: go_.*|promhttp_.*
