---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "networking",
                "interface": "iot",
                "ips": [
                  "10.1.20.40/24",
                  "fd79:4c9c:b9c3:20::40/64"
                ]
              }]
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: false
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
            sysctls:
              # accept RA route-info (Thread OMR prefix)
              - name: net.ipv6.conf.iot.accept_ra_rt_info_max_plen
                value: "64"
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
            env:
              TZ: Europe/London
            args:
              - --storage-path=/data
              - --ota-provider-dir=/data/ota
              - --production-mode
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
              readiness: *probe
            resources:
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 5580
    route:
      app:
        hostnames:
          - matter.starstreak.net
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: matter-server-config
      tmp:
        type: emptyDir
