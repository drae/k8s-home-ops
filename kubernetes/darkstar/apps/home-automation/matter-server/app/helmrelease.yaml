---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.1@sha256:9a1019f3abd32e30d96446ee84c44c3c949250b53de54f027160b9a9b2656749
            env:
              TZ: Europe/London
            args:
              - --storage-path=/data
              - --ota-provider-dir=/data/ota
              - --production-mode
              # Same fabric as the HAOS add-on (storage: /data/server-2-134b)
              - --vendorid=4939
              - --fabricid=2
              - --primary-interface=eno1
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
              readiness: *probe
            resources:
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        pod:
          nodeSelector:
            feature.node.kubernetes.io/usb-zigbee: "true"
    defaultPodOptions:
      # Shares the host routing table, including otbr's route to the Thread mesh
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: false
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 5580
    route:
      app:
        hostnames:
          - matter.starstreak.net
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      data:
        existingClaim: matter-server-config
      tmp:
        type: emptyDir
