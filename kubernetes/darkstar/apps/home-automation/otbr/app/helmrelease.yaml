---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      otbr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/wittdennis/homeassistant-otbr
              tag: 4.2.2@sha256:80f35717025aa5a15ce593232c2531e67e123e3e439545d5320e35a7c60da017
            env:
              BACKBONE_IF: iot
              BAUDRATE: "460800"
              DEVICE: /dev/ttyUSB0
              FIREWALL: "0"
              NAT64: "1"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node/state
                    port: 8081
              readiness: *probe
            resources:
              requests:
                memory: 256M
              limits:
                memory: 512M
            securityContext:
              privileged: true
        pod:
          nodeSelector:
            feature.node.kubernetes.io/usb-zigbee: "true"
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "networking",
            "interface": "iot",
            "ips": [
              "10.1.20.41/24",
              "fd79:4c9c:b9c3:20::41/64"
            ]
          }]
      securityContext:
        runAsNonRoot: false # Must be run as root user
        runAsUser: 0 # Must be run as root user
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
          - name: net.ipv6.conf.all.forwarding
            value: "1"
          - name: net.ipv6.conf.iot.accept_ra
            value: "2"
    service:
      app:
        controller: otbr
        ports:
          http:
            port: 8081
    persistence:
      data:
        existingClaim: "${VOLSYNC_CLAIM}"
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_94A990D0278C-if00
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ttyUSB0
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
      tmp:
        type: emptyDir
        globalMounts:
          - path: /run
            subPath: run
