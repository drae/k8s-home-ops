---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      otbr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/wittdennis/homeassistant-otbr
              tag: 4.2.6@sha256:a0c2b5eeb050b415815344c2206a9fde52a0b69bfa1c66527bbaf5ed2bf5d6c3
            env:
              BACKBONE_IF: eno1
              BAUDRATE: "460800"
              DEVICE: /dev/ttyUSB0
              FIREWALL: "0"
              NAT64: "0" # avoid touching host iptables alongside cilium
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node/state
                    port: 8081
              readiness: *probe
            resources:
              requests:
                memory: 256M
              limits:
                memory: 512M
            securityContext:
              privileged: true
        pod:
          nodeSelector:
            feature.node.kubernetes.io/usb-zigbee: "true"
    defaultPodOptions:
      # Thread border routing needs the LAN (same network as phones) as the backbone
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false # Must be run as root user
        runAsUser: 0 # Must be run as root user
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: otbr
        ports:
          http:
            port: 8081
    persistence:
      data:
        existingClaim: "${VOLSYNC_CLAIM}"
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_94A990D0278C-if00
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ttyUSB0
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
      tmp:
        type: emptyDir
        globalMounts:
          - path: /run
            subPath: run
