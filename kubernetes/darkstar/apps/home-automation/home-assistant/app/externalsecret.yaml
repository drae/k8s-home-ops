---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: home-assistant-secret
    creationPolicy: Owner
    template:
      data:
        HASS_LATITUDE: "{{ .latitude }}"
        HASS_LONGITUDE: "{{ .longitude }}"
        HASS_ELEVATION: "{{ .elevation }}"
        HASS_HIVE_USERNAME: "{{ .hive_user }}"
        HASS_HIVE_PASSWORD: "{{ .hive_pass }}"
        HASS_LG_OLED_MAC: "{{ .lg_oled_mac }}"
        HA_LONG_LIVED_TOKEN: "{{ .presence_token }}"
        SONARR_AUTH_APIKEY: "{{ .SONARR__AUTH__APIKEY }}"
        RADARR_AUTH_APIKEY: "{{ .RADARR__AUTH__APIKEY }}"
        TAUTULLI_RECENTLY_ADDED_URL: "http://tautulli.media:8181/api/v2?apikey={{ .TAUTULLI__AUTH__APIKEY }}&cmd=get_recently_added&count=40"
        TAUTULLI_PLAYS_URL: "http://tautulli.media:8181/api/v2?apikey={{ .TAUTULLI__AUTH__APIKEY }}&cmd=get_plays_by_date&time_range=7"
        TAUTULLI_LIBRARIES_URL: "http://tautulli.media:8181/api/v2?apikey={{ .TAUTULLI__AUTH__APIKEY }}&cmd=get_libraries"
        TAUTULLI_ACTIVITY_URL: "http://tautulli.media:8181/api/v2?apikey={{ .TAUTULLI__AUTH__APIKEY }}&cmd=get_activity"
  dataFrom:
    - extract:
        key: /darkstar/k8s/HASS
  data:
    - secretKey: RADARR__AUTH__APIKEY
      remoteRef:
        key: /darkstar/k8s/RADARR_AUTH_APIKEY
    - secretKey: SONARR__AUTH__APIKEY
      remoteRef:
        key: /darkstar/k8s/SONARR_AUTH_APIKEY
    - secretKey: TAUTULLI__AUTH__APIKEY
      remoteRef:
        key: /darkstar/k8s/TAUTULLI_AUTH_APIKEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-ai
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: home-assistant-ai-secret
    creationPolicy: Owner
    template:
      data:
        STT_OPENAI_KEY: "{{ .openai_voice_key }}"
        TTS_OPENAI_KEY: "{{ .openai_voice_key }}"
        AZURE_SUBSCRIPTION_KEY: "{{ .azure_voice_key }}"
        AZURE_SERVICE_REGION: "{{ .azure_service_region }}"
  dataFrom:
    - extract:
        key: /darkstar/k8s/OPENAI
      rewrite:
        - regexp:
            source: "(.*)"
            target: "openai_$1"
    - extract:
        key: /darkstar/k8s/AZURE
      rewrite:
        - regexp:
            source: "(.*)"
            target: "azure_$1"
