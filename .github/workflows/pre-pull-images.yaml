---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pre-pull Images

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  extract-images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Extract Images
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    outputs:
      images: ${{ steps.extract-images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: github:home-operations/flate

      - name: Extract Images
        id: extract-images
        env:
          FLATE_BASE: origin/${{ github.event.pull_request.base.ref }}
          FLATE_NO_PROGRESS: "true"
          FLATE_PATH: ./kubernetes/darkstar/flux/cluster
        run: |
          flate diff images --output json > images.json
          echo "images=$(jq --compact-output '.' images.json)" >> "${GITHUB_OUTPUT}"

          {
            echo "## New images to pull"
            echo '```json'
            jq '.' images.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  pre-pull-images:
    # Self-hosted runner has talosctl access to the cluster; never run fork PRs on it
    if: >-
      ${{
        needs.extract-images.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: Pre-pull Images
    runs-on: arc-k8s-home-ops
    needs:
      - extract-images
    strategy:
      matrix:
        images: ${{ fromJSON(needs.extract-images.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.images }}
    steps:
      - name: Attest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "${MATRIX_IMAGE}" in
            *home-operations*)
              gh attestation verify --owner home-operations "oci://${MATRIX_IMAGE}" ;;
            *bjw-s-labs*)
              gh attestation verify --owner bjw-s-labs "oci://${MATRIX_IMAGE}" ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .mise.toml
          sparse-checkout-cone-mode: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: talosctl

      - name: Pre-pull Image
        run: talosctl -n "$NODE" image pull "${MATRIX_IMAGE}"

  pre-pull-images-success:
    if: ${{ !cancelled() }}
    needs:
      - extract-images
      - pre-pull-images
    name: Pre-pull Images Successful
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "${RESULTS}"
