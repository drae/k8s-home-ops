---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  test:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Test
    needs: filter-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
          install_args: github:home-operations/flate

      - name: Run flate test
        env:
          FLATE_NO_PROGRESS: "true"
          FLATE_PATH: ./kubernetes/darkstar/flux/cluster
        run: flate test all

  diff:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Diff
    needs: filter-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
          install_args: github:home-operations/flate

      - name: Run flate diff
        id: diff
        env:
          FLATE_BASE: origin/${{ github.event.pull_request.base.ref }}
          FLATE_NO_PROGRESS: "true"
          FLATE_OUTPUT: github
          FLATE_PATH: ./kubernetes/darkstar/flux/cluster
          RESOURCES: ${{ matrix.resources }}
        run: |
          flate diff "${RESOURCES}" > diff.patch

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "diff<<${delimiter}"
            cat diff.patch
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Flux ${RESOURCES} diff"
            echo '```diff'
            cat diff.patch
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate Token
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          permission-pull-requests: write

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  status:
    if: ${{ !cancelled() }}
    name: Flate - Success
    needs: ["test", "diff"]
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "${RESULTS}"
