---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  genconfig:
    desc: Render clusterconfig for all Talos nodes from the cluster/role/node templates
    silent: true
    vars:
      NODE_FILES:
        sh: find {{.INFRASTRUCTURE_DIR}}/talos/darkstar/nodes -type f -name '*.yaml.j2' -printf '%P\n'
    cmds:
      - for:
          var: NODE_FILES
        task: _render-machineconfig
        vars:
          # e.g. "controlplane/alpha.yaml.j2" -> role=controlplane, node=alpha
          role: '{{ .ITEM | splitList "/" | first }}'
          node: '{{ .ITEM | splitList "/" | last | trimSuffix ".yaml.j2" }}'
    preconditions:
      - which infisical minijinja-cli talosctl yq jq curl
      - test -f {{.INFRASTRUCTURE_DIR}}/talos/darkstar/version.yaml
      - test -f {{.INFRASTRUCTURE_DIR}}/talos/darkstar/schematic.yaml

  _render-machineconfig:
    internal: true
    desc: Render + merge a single node's machine config from templates
    requires:
      vars:
        - role
        - node
    vars:
      TALOS_DIR: "{{.INFRASTRUCTURE_DIR}}/talos/darkstar"
      TALOS_VERSION:
        sh: yq '.talos_version' {{.INFRASTRUCTURE_DIR}}/talos/darkstar/version.yaml
      KUBERNETES_VERSION:
        sh: yq '.kubernetes_version' {{.INFRASTRUCTURE_DIR}}/talos/darkstar/version.yaml
      # https://factory.talos.dev/schematics - deterministic id derived from
      # schematic.yaml's content (extensions + kernel args). Read-only POST,
      # does not touch the node.
      SCHEMATIC_ID:
        sh: curl -sX POST --data-binary @{{.INFRASTRUCTURE_DIR}}/talos/darkstar/schematic.yaml https://factory.talos.dev/schematics | jq -r '.id'
      TMP_CLUSTER: "{{.TALOS_DIR}}/clusterconfig/.render-cluster.yaml"
      TMP_ROLE: "{{.TALOS_DIR}}/clusterconfig/.render-role.yaml"
      TMP_NODE: "{{.TALOS_DIR}}/clusterconfig/.render-node.yaml"
      TMP_MERGED: "{{.TALOS_DIR}}/clusterconfig/.render-merged.yaml"
    cmds:
      - infisical run --path=/darkstar/talos --
        minijinja-cli {{.TALOS_DIR}}/cluster.yaml.j2
        -D schematic={{.SCHEMATIC_ID}} -D talos_version={{.TALOS_VERSION}}
        -D kubernetes_version={{.KUBERNETES_VERSION}}
        -o {{.TMP_CLUSTER}}
      - infisical run --path=/darkstar/talos --
        minijinja-cli {{.TALOS_DIR}}/{{.role}}.yaml.j2
        -D kubernetes_version={{.KUBERNETES_VERSION}}
        -o {{.TMP_ROLE}}
      - infisical run --path=/darkstar/talos --
        minijinja-cli {{.TALOS_DIR}}/nodes/{{.role}}/{{.node}}.yaml.j2
        -o {{.TMP_NODE}}
      - talosctl machineconfig patch {{.TMP_CLUSTER}}
        -p @{{.TMP_ROLE}} -p @{{.TMP_NODE}} -o {{.TMP_MERGED}}
      # Output filename must stay "darkstar-<hostname>.yaml" - applyconfig
      # and upgrade-node derive the node to target from this exact pattern.
      - |
        HOSTNAME=$(yq ea 'select(.kind == "HostnameConfig") | .hostname' {{.TMP_MERGED}})
        mv {{.TMP_MERGED}} {{.TALOS_DIR}}/clusterconfig/darkstar-${HOSTNAME}.yaml
      - rm -f {{.TMP_CLUSTER}} {{.TMP_ROLE}} {{.TMP_NODE}}
    preconditions:
      - test -f {{.INFRASTRUCTURE_DIR}}/talos/darkstar/{{.role}}.yaml.j2
      - test -f {{.INFRASTRUCTURE_DIR}}/talos/darkstar/nodes/{{.role}}/{{.node}}.yaml.j2

  applyconfig:
    desc: Apply clusterconfig for a Talos cluster
    vars:
      CLUSTERCONFIG_FILES:
        sh: find {{.INFRASTRUCTURE_DIR}}/talos/darkstar/clusterconfig -type f -name '*.yaml' -printf '%f\n'
    cmds:
      - for:
          var: CLUSTERCONFIG_FILES
        task: _apply-machineconfig
        vars:
          filename: "{{.ITEM}}"
          hostname: |-
            {{ trimPrefix (printf "%s-" "darkstar") .ITEM | trimSuffix ".yaml" }}
    preconditions:
      - talosctl config get-contexts | grep darkstar
      - test -d {{.INFRASTRUCTURE_DIR}}/talos/darkstar/clusterconfig

  kubeconfig:
    desc: Generate kubeconfig for a Talos cluster
    preconditions:
      - which talosctl
      - test -f "${TALOSCONFIG}"
    silent: true
    dir: "{{ .TALOS_DIR }}"
    cmds:
      - talosctl kubeconfig

  reset:
    desc: Reset a node to maintenance mode
    silent: true
    prompt: "Reset node {{ .HOSTNAME }}?"
    preconditions:
      - which talosctl
      - test -f "${TALOSCONFIG}"
    requires:
      vars:
        - HOSTNAME
    cmds:
      - talosctl reset --graceful=false -n {{ .HOSTNAME }} --reboot

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    dir: "{{ .TALOS_DIR }}"
    preconditions:
      - which talosctl
      - test -f "${TALOSCONFIG}"
      - talosctl --nodes {{ .NODE }} get machineconfig
    requires:
      vars:
        - NODE
    vars:
      FILE:
        sh: ls clusterconfig/darkstar-{{ .NODE }}*.yaml
      TALOS_IMAGE:
        sh: yq '.machine.install.image' < "{{ .FILE }}"
    cmds:
      - talosctl --nodes {{ .NODE }} upgrade --image="{{ .TALOS_IMAGE }}" --timeout=10m
      - talosctl --nodes {{ .NODE }} health

  _apply-machineconfig:
    internal: true
    desc: Apply a single Talos machineConfig to a Talos node
    cmds:
      - talosctl --context darkstar apply-config
        --nodes "{{.hostname}}"
        --file "{{.INFRASTRUCTURE_DIR}}/talos/darkstar/clusterconfig/{{.filename}}"
        --mode="{{.MODE}}"
        {{ if eq "true" .INSECURE }}--insecure{{ end }}
        {{ if eq "true" .DRY_RUN }}--dry-run{{ end }}
    preconditions:
      - talosctl config get-contexts | grep darkstar
      - test -f {{.INFRASTRUCTURE_DIR}}/talos/darkstar/clusterconfig/{{.filename}}
    requires:
      vars:
        - hostname
        - filename
    vars:
      MODE: '{{.MODE | default "auto"}}'
