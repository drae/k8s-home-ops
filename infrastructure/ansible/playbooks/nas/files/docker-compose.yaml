---
secrets:
  api_secret:
    file: /opt/docker/doco-cd/.config/api_secret
  webhook_secret:
    file: /opt/docker/doco-cd/.config/webhook_secret
  infisical_secret:
    file: /opt/docker/doco-cd/.config/infisical_secret
  apprise_notify_urls:
    file: /opt/docker/doco-cd/.config/apprise_notify_urls

services:
  app:
    container_name: doco-cd
    depends_on:
      apprise:
        condition: service_healthy
    environment:
      API_SECRET_FILE: /run/secrets/api_secret
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_LEVEL: success
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise_notify_urls
      DEPLOY_CONFIG_BASE_DIR: ./docker/apollo
      HTTP_PORT: 8880
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/drae/k8s-home-ops.git
          reference: refs/heads/main
          interval: 3600
      SECRET_PROVIDER: infisical
      SECRET_PROVIDER_SITE_URL: https://eu.infisical.com/
      SECRET_PROVIDER_CLIENT_ID: bf4cb727-bd78-4fbf-a874-e5eecfc2f3ed
      SECRET_PROVIDER_CLIENT_SECRET_FILE: /run/secrets/infisical_secret
      TZ: Europe/Amsterdam
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.123.0@sha256:11b474122ed530614cbe4cb8390f94b646d3fc8ba40d74c0f0b7f55a8ca719f8
    ports:
      - 8880:8880
    restart: unless-stopped
    secrets:
      - api_secret
      - webhook_secret
      - infisical_secret
      - apprise_notify_urls
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

  # Stateless relay: doco-cd sends the target URLs with each request
  apprise:
    container_name: apprise
    environment:
      APPRISE_WORKER_COUNT: 1
      TZ: Europe/Amsterdam
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/status >/dev/null || exit 1
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    image: docker.io/caronc/apprise:2.0.1@sha256:0b2913b15c8eb47c25345722985ffbfae701326edde21909c205d296d62dd52c
    restart: unless-stopped

volumes:
  data: {}
