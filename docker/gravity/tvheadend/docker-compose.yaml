---
services:
  tvh:
    image: ghcr.io/linuxserver/tvheadend:latest@sha256:fcc4b2091c573bd0b5ec04cf09db9acf0907e23d3bca9b53b0a0111bc8ae1fc3
    container_name: tvheadend
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.tvheadend.rule=Host(`tvheadend.starstreak.net`)
      - traefik.http.services.tvheadend.loadbalancer.server.port=9981
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    network_mode: host
    volumes:
      - /opt/docker/tvh/data:/config
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
