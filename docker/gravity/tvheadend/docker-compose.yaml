---
services:
  tvh:
    image: ghcr.io/linuxserver/tvheadend:latest@sha256:989fd717b2b143b8861ab60c31053c1d3542368532af1d429e996fa61e4fc04b
    container_name: tvheadend
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.tvheadend.rule=Host(`tvheadend.starstreak.net`)
      - traefik.http.services.tvheadend.loadbalancer.server.port=9981
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    network_mode: host
    volumes:
      - /opt/docker/tvh/data:/config
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
