---
services:
  dozzle:
    image: docker.io/amir20/dozzle:v11.2.0
    container_name: dozzle
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle-gravity.starstreak.net`)
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
    environment:
      - TZ=Europe/London
      - DOZZLE_HOSTNAME=gravity
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_AUTH_TTL=168h
      - DOZZLE_NO_ANALYTICS=true
    ports:
      - 8090:8080/tcp # dozzle web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/data
    configs:
      - source: users
        target: /data/users.yml
        mode: 0400
      - source: notifications
        target: /data/notifications.yml
        mode: 0400

configs:
  users:
    content: |
      users:
        paul:
          name: Paul
          password: ${DOZZLE_PASSWORD_HASH}
          filter:
          roles:
  # Managed here; alerts edited in the UI won't persist
  notifications:
    content: |
      dispatchers:
        - id: 1
          name: discord
          type: webhook
          url: ${DOCKER_DISCORD_URL}
          template: |
            {
              "content": "{{ .Container.Name }}",
              "embeds": [
                {
                  "title": "{{ .Container.Name }}",
                  "description": "{{ .Detail }}",
                  "fields": [
                    { "name": "Host", "value": "{{ .Container.HostName }}", "inline": true },
                    { "name": "Image", "value": "{{ .Container.Image }}", "inline": true }
                  ]
                }
              ]
            }
      subscriptions:
        - id: 1
          name: container-lifecycle
          enabled: true
          dispatcherId: 1
          containerExpression: "true"
          eventExpression: >-
            name in ["start", "die", "oom"] ||
            (name == "health_status" && attributes["healthStatus"] == "unhealthy")

volumes:
  data: {}
